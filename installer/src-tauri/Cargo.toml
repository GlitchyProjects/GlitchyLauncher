[package]
name = "glitchy-web-setup"
version = "1.3.1"
edition = "2021"
description = "Glitchy Launcher web-UI setup bootstrapper"

[lib]
name = "glitchy_web_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "glitchy-web-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
mslnk = "0.1.8"
dirs = "6.0"
winreg = "0.52"

[profile.release]
strip = true
lto = true
